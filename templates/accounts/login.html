{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion – UniNotes ERP</title>
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo"><h1>UniNotes ERP</h1><p>Application de suivi académique</p></div>
    {% if messages %}{% for message in messages %}<div class="alert alert-{{ message.tags }}">{{ message }}</div>{% endfor %}{% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="form-group"><label>Nom d'utilisateur</label><input type="text" name="username" class="form-control" placeholder="Votre identifiant" required autofocus></div>
      <div class="form-group"><label>Mot de passe</label><input type="password" name="password" class="form-control" placeholder="••••••••" required></div>
      {% if form.errors %}<div class="alert alert-error">Identifiants incorrects.</div>{% endif %}
      <button type="submit" class="btn btn-primary" style="width:100%">Se connecter</button>
    </form>
    <div class="auth-divider">Pas encore de compte ? <a href="{% url 'register' %}">S'inscrire</a></div>
  </div>
</div>
</body>
</html>
